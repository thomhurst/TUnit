name: 'Hello World'
description: 'Greet someone'
inputs:
  categories:
    description: Categories to run
    required: false
    default: ''
  ignore-categories:
    description: Categories to skip
    required: false
    default: ''
  admin-token:
    description: 'Admin token'
    required: true
  publish-packages:
    description: Publish packages?
    required: false
    default: 'false'
  nuget-apikey:
    description: 'NuGet API Key'
    required: false
    default: ''
  environment:
    description: 'Environment'
    required: false
    default: 'Development'
  netversion:
    description: 'Net version'
    required: false
    default: 'net10.0'

runs:
  using: "composite"
  steps:
    - name: Run Pipeline
      shell: bash
      run: |
        read -ra categories <<< "$PIPELINE_CATEGORIES"
        read -ra ignore_categories <<< "$PIPELINE_IGNORE_CATEGORIES"
        args=(--categories "${categories[@]}")
        if [ ${#ignore_categories[@]} -gt 0 ]; then
          args+=(--ignore-categories "${ignore_categories[@]}")
        fi
        dotnet run -c Release --no-build "${args[@]}"
      working-directory: "tools/TUnit.Pipeline"
      env:
        PIPELINE_CATEGORIES: ${{ inputs.categories }}
        PIPELINE_IGNORE_CATEGORIES: ${{ inputs.ignore-categories }}
        ADMIN_TOKEN: ${{ inputs.admin-token }}
        GITHUB_TOKEN: ${{ github.token }}
        DOTNET_ENVIRONMENT: ${{ inputs.environment }}
        NuGet__ApiKey: ${{ inputs.nuget-apikey }}
        NuGet__ShouldPublish: ${{ inputs.publish-packages }}
        NET_VERSION: ${{ inputs.netversion }}
        ACTIONS_RUNTIME_TOKEN: ${{ env.ACTIONS_RUNTIME_TOKEN }}
        ACTIONS_RESULTS_URL: ${{ env.ACTIONS_RESULTS_URL }}
