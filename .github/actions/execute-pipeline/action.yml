name: 'Hello World'
description: 'Greet someone'
inputs:
  categories:
    description: Categories to run
    required: false
    default: ''
  ignore-categories:
    description: Categories to skip
    required: false
    default: ''
  os-specific-only:
    description: Run only what can differ by operating system (see PipelineScope)
    required: false
    default: 'false'
  admin-token:
    description: 'Admin token'
    required: true
  publish-packages:
    description: Publish packages?
    required: false
    default: 'false'
  nuget-apikey:
    description: 'NuGet API Key'
    required: false
    default: ''
  environment:
    description: 'Environment'
    required: false
    default: 'Development'
  netversion:
    description: 'Net version'
    required: false
    default: 'net10.0'

runs:
  using: "composite"
  steps:
    - name: Setup pipeline SDK
      uses: actions/setup-dotnet@v6.1.0
      with:
        global-json-file: tools/TUnit.Pipeline/global.json

    - name: Build Pipeline
      shell: bash
      run: dotnet build -c Release
      working-directory: tools/TUnit.Pipeline
    - name: Run Pipeline
      shell: bash
      run: |
        read -ra categories <<< "$PIPELINE_CATEGORIES"
        read -ra ignore_categories <<< "$PIPELINE_IGNORE_CATEGORIES"
        args=(--categories "${categories[@]}")
        if [ ${#ignore_categories[@]} -gt 0 ]; then
          args+=(--ignore-categories "${ignore_categories[@]}")
        fi
        if [ "$PIPELINE_OS_SPECIFIC_ONLY" = "true" ]; then
          args+=(--os-specific-only)
        fi
        dotnet tools/TUnit.Pipeline/bin/Release/net11.0/TUnit.Pipeline.dll "${args[@]}"
      working-directory: ${{ github.workspace }}
      env:
        PIPELINE_CATEGORIES: ${{ inputs.categories }}
        PIPELINE_IGNORE_CATEGORIES: ${{ inputs.ignore-categories }}
        PIPELINE_OS_SPECIFIC_ONLY: ${{ inputs.os-specific-only }}
        ADMIN_TOKEN: ${{ inputs.admin-token }}
        GITHUB_TOKEN: ${{ github.token }}
        DOTNET_ENVIRONMENT: ${{ inputs.environment }}
        NuGet__ApiKey: ${{ inputs.nuget-apikey }}
        NuGet__ShouldPublish: ${{ inputs.publish-packages }}
        NET_VERSION: ${{ inputs.netversion }}
        ACTIONS_RUNTIME_TOKEN: ${{ env.ACTIONS_RUNTIME_TOKEN }}
        ACTIONS_RESULTS_URL: ${{ env.ACTIONS_RESULTS_URL }}
