name: Platform smoke tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  TESTINGPLATFORM_TELEMETRY_OPTOUT: 1

jobs:
  smoke:
    name: ${{ matrix.platform }} smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Browser
            workload: wasm-tools
          - platform: Android
            workload: android
          - platform: WASI
            workload: wasi-experimental
    env:
      SmokePlatform: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 11.0.100-rc.2.26504.105
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: platform-smoke-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-${{ hashFiles('global.json', 'Directory.Packages.props', 'tests/TUnit.PlatformSmoke/TUnit.PlatformSmoke.csproj') }}
          restore-keys: platform-smoke-${{ runner.os }}-${{ runner.arch }}-${{ matrix.platform }}-
      - run: dotnet workload install ${{ matrix.workload }}
      - name: Install XHarness
        if: matrix.platform == 'Browser'
        run: >-
          dotnet tool install Microsoft.DotNet.XHarness.CLI --global
          --version 10.0.0-prerelease.26471.3
          --add-source https://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet-eng/nuget/v3/index.json
      - name: Publish the browser smoke test
        if: matrix.platform == 'Browser'
        run: dotnet publish tests/TUnit.PlatformSmoke -c Debug
      - name: Build the smoke test
        if: matrix.platform != 'Browser'
        run: dotnet build tests/TUnit.PlatformSmoke -c Debug
      - name: Execute the TUnit smoke test in Chrome
        if: matrix.platform == 'Browser'
        run: >-
          xharness wasm test-browser
          --app=tests/TUnit.PlatformSmoke/bin/Debug/net11.0/publish/wwwroot
          --browser=chrome --expected-exit-code=0 --timeout=00:02:00
          --output-directory=artifacts/platform-smoke/browser
      - name: Enable KVM
        if: matrix.platform == 'Android'
        run: sudo chmod 666 /dev/kvm
      - name: Execute the TUnit smoke test on Android
        if: matrix.platform == 'Android'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            mkdir -p artifacts/platform-smoke/Android
            bash -o pipefail -c 'dotnet test --project "$GITHUB_WORKSPACE/tests/TUnit.PlatformSmoke/TUnit.PlatformSmoke.csproj" --no-build 2>&1 | tee artifacts/platform-smoke/Android/test.log'
      - uses: bytecodealliance/actions/wasmtime/setup@v1.1.3
        if: matrix.platform == 'WASI'
        with:
          version: v49.0.1
      - name: Execute the TUnit smoke test on WASI
        if: matrix.platform == 'WASI'
        working-directory: tests/TUnit.PlatformSmoke/bin/Debug/net11.0/wasi-wasm
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts/platform-smoke/WASI"
          wasmtime run -S http --dir . dotnet.wasm TUnit.PlatformSmoke \
            2>&1 | tee "$GITHUB_WORKSPACE/artifacts/platform-smoke/WASI/run.log"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: platform-smoke-${{ matrix.platform }}
          path: artifacts/platform-smoke
          if-no-files-found: ignore

  # The Apple platforms share one runner: macOS runners are the scarcest, and with a job per
  # platform every push queued three of them on top of the .NET matrix's own. One runner also
  # installs the workloads once and builds the referenced TUnit libraries once. Each platform
  # still runs after an earlier one fails, so a single run reports all three.
  apple-smoke:
    name: Apple smoke tests
    # The .NET 11 Apple workloads (27.x) require Xcode 27, which only the xcode-27 image has.
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 11.0.100-rc.2.26504.105
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: platform-smoke-${{ runner.os }}-${{ runner.arch }}-Apple-${{ hashFiles('global.json', 'Directory.Packages.props', 'tests/TUnit.PlatformSmoke/TUnit.PlatformSmoke.csproj') }}
          restore-keys: platform-smoke-${{ runner.os }}-${{ runner.arch }}-Apple-
      - name: Select the installed Xcode
        run: sudo xcode-select --switch /Applications/Xcode_27.0.app
      # Boots in the background while the workloads install and the app builds.
      - name: Start the iOS simulator
        run: |
          device=$(xcrun simctl list devices available --json | jq -er '.devices["com.apple.CoreSimulator.SimRuntime.iOS-27-0"] | map(select(.name == "iPhone 17")) | first | .udid // error("Required preinstalled simulator is missing")')
          xcrun simctl boot "$device"
          echo "IosDevice=$device" >> "$GITHUB_ENV"
      - name: Install the Apple workloads
        id: workloads
        run: dotnet workload install ios tvos maccatalyst

      - name: Build the iOS smoke test
        id: ios-build
        if: ${{ !cancelled() && steps.workloads.outcome == 'success' }}
        env:
          SmokePlatform: iOS
        run: dotnet build tests/TUnit.PlatformSmoke -c Debug
      - name: Execute the TUnit smoke test in the iOS simulator
        if: ${{ !cancelled() && steps.ios-build.outcome == 'success' }}
        timeout-minutes: 15
        shell: bash
        env:
          SmokePlatform: iOS
        run: scripts/Run-AppleSimulatorSmoke.sh "$IosDevice" ios
      # One simulator at a time: the runner has 7 GB of memory.
      - name: Swap the iOS simulator for the tvOS one
        if: ${{ !cancelled() && steps.workloads.outcome == 'success' }}
        run: |
          xcrun simctl shutdown "$IosDevice" || true
          device=$(xcrun simctl list devices available --json | jq -er '.devices["com.apple.CoreSimulator.SimRuntime.tvOS-27-0"] | map(select(.name == "Apple TV 4K (3rd generation)")) | first | .udid // error("Required preinstalled simulator is missing")')
          xcrun simctl boot "$device"
          echo "TvosDevice=$device" >> "$GITHUB_ENV"
      - name: Build the tvOS smoke test
        id: tvos-build
        if: ${{ !cancelled() && steps.workloads.outcome == 'success' }}
        env:
          SmokePlatform: tvOS
        run: dotnet build tests/TUnit.PlatformSmoke -c Debug
      - name: Execute the TUnit smoke test in the tvOS simulator
        if: ${{ !cancelled() && steps.tvos-build.outcome == 'success' }}
        timeout-minutes: 15
        shell: bash
        env:
          SmokePlatform: tvOS
        run: scripts/Run-AppleSimulatorSmoke.sh "$TvosDevice" tvos

      - name: Build the Mac Catalyst smoke test
        id: maccatalyst-build
        if: ${{ !cancelled() && steps.workloads.outcome == 'success' }}
        env:
          SmokePlatform: MacCatalyst
        run: dotnet build tests/TUnit.PlatformSmoke -c Debug
      - name: Execute the TUnit smoke test on Mac Catalyst
        if: ${{ !cancelled() && steps.maccatalyst-build.outcome == 'success' }}
        working-directory: tests/TUnit.PlatformSmoke
        timeout-minutes: 10
        shell: bash
        env:
          SmokePlatform: MacCatalyst
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts/platform-smoke/MacCatalyst"
          dotnet test --project "$GITHUB_WORKSPACE/tests/TUnit.PlatformSmoke/TUnit.PlatformSmoke.csproj" --no-build --minimum-expected-tests 1 \
            2>&1 | tee "$GITHUB_WORKSPACE/artifacts/platform-smoke/MacCatalyst/test.log"

      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: platform-smoke-Apple
          path: artifacts/platform-smoke
          if-no-files-found: ignore
