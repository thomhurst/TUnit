name: Platform smoke tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  smoke:
    name: ${{ matrix.platform }} smoke test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # WASI currently fails at the generated async Main on its threadless runtime.
    # Keep executing it on PRs so progress is visible without blocking supported platforms.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Browser
            os: ubuntu-latest
            workload: wasm-tools
            experimental: false
          - platform: Android
            os: ubuntu-latest
            workload: android
            experimental: false
          - platform: iOS
            os: macos-26-intel
            workload: ios
            device: iPhone
            experimental: false
          - platform: tvOS
            os: macos-26-intel
            workload: tvos
            device: Apple TV
            experimental: false
          - platform: MacCatalyst
            os: macos-26-intel
            workload: maccatalyst
            experimental: false
          - platform: WASI
            os: ubuntu-latest
            workload: wasi-experimental
            experimental: true
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      TESTINGPLATFORM_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet workload install ${{ matrix.workload }}
      - name: Install XHarness
        if: matrix.platform == 'Browser' || matrix.platform == 'Android'
        run: >-
          dotnet tool install Microsoft.DotNet.XHarness.CLI --global
          --version 10.0.0-prerelease.26471.3
          --add-source https://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet-eng/nuget/v3/index.json
      - name: Build the smoke test for WebAssembly
        if: matrix.platform == 'Browser' || matrix.platform == 'WASI'
        run: dotnet build tests/TUnit.PlatformSmoke -p:SmokePlatform=${{ matrix.platform }}
      - name: Package the smoke test for Android
        if: matrix.platform == 'Android'
        run: dotnet publish tests/TUnit.PlatformSmoke -c Debug -p:SmokePlatform=Android
      - name: Package the smoke test for Apple
        if: runner.os == 'macOS'
        run: dotnet publish tests/TUnit.PlatformSmoke -c Debug -p:SmokePlatform=${{ matrix.platform }}
      - name: Execute the TUnit smoke test in Chrome
        if: matrix.platform == 'Browser'
        run: >-
          xharness wasm test-browser
          --app=tests/TUnit.PlatformSmoke/bin/Debug/net10.0/browser-wasm/AppBundle
          --browser=chrome --expected-exit-code=0 --timeout=00:02:00
          --output-directory=artifacts/platform-smoke/browser
      - name: Enable KVM
        if: matrix.platform == 'Android'
        run: sudo chmod 666 /dev/kvm
      - name: Execute the TUnit smoke test on Android
        if: matrix.platform == 'Android'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install tests/TUnit.PlatformSmoke/bin/mobile/Android/bin/TUnitSmoke.apk
            xharness android run --package-name=net.dot.TUnitSmoke --instrumentation=net.dot.MonoRunner --arg=--minimum-expected-tests=1 --expected-exit-code=0 --timeout=00:02:00 --output-directory=artifacts/platform-smoke/Android
      - name: Boot the Apple simulator
        if: matrix.platform == 'iOS' || matrix.platform == 'tvOS'
        timeout-minutes: 10
        run: |
          device=$(xcrun simctl list devices available --json | jq -r '[.devices[][] | select(.name | startswith("${{ matrix.device }}"))][0].udid')
          xcrun simctl bootstatus "$device" -b
          echo "SMOKE_DEVICE=$device" >> "$GITHUB_ENV"
      - name: Execute the TUnit smoke test on Apple simulators
        if: matrix.platform == 'iOS' || matrix.platform == 'tvOS'
        timeout-minutes: 10
        shell: bash
        run: |
          mkdir -p artifacts/platform-smoke/${{ matrix.platform }}
          xcrun simctl install "$SMOKE_DEVICE" "$(find tests/TUnit.PlatformSmoke/bin/mobile/${{ matrix.platform }} -name TUnitSmoke.app -type d -print -quit)"
          SIMCTL_CHILD_OS_ACTIVITY_DT_MODE=YES SIMCTL_CHILD_NSUnbufferedIO=YES \
            xcrun simctl launch --console --terminate-running-process "$SMOKE_DEVICE" net.dot.TUnitSmoke \
            --minimum-expected-tests 1 2>&1 | tee artifacts/platform-smoke/${{ matrix.platform }}/test.log
      - name: Execute the TUnit smoke test on Mac Catalyst
        if: matrix.platform == 'MacCatalyst'
        timeout-minutes: 2
        shell: bash
        run: |
          mkdir -p artifacts/platform-smoke/MacCatalyst
          "$(find tests/TUnit.PlatformSmoke/bin/mobile/MacCatalyst -name TUnitSmoke.app -type d -print -quit)/Contents/MacOS/TUnitSmoke" \
            --minimum-expected-tests 1 --results-directory "$HOME/Library/Containers/net.dot.TUnitSmoke/Data/TestResults" \
            2>&1 | tee artifacts/platform-smoke/MacCatalyst/test.log
      - name: Verify the Apple application completed successfully
        if: matrix.platform == 'iOS' || matrix.platform == 'tvOS'
        # simctl can return zero after a native crash; require the app's own exit code.
        run: >-
          grep -RE 'DOTNET\.APP_EXIT_CODE: 0$' artifacts/platform-smoke/${{ matrix.platform }}
      - uses: bytecodealliance/actions/wasmtime/setup@v1.1.3
        if: matrix.platform == 'WASI'
        with:
          version: v49.0.1
      - name: Execute the TUnit smoke test on WASI (experimental)
        if: matrix.platform == 'WASI'
        working-directory: tests/TUnit.PlatformSmoke/bin/Debug/net10.0/wasi-wasm/AppBundle
        run: wasmtime run -S http --dir . dotnet.wasm TUnit.PlatformSmoke
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: platform-smoke-${{ matrix.platform }}
          path: artifacts/platform-smoke
          if-no-files-found: ignore
