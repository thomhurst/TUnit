name: AOT

# The engine tests, and the native AOT publishes: the test app with the AOT-mode engine tests that
# run against it, and the NugetTester against freshly packed packages. UploadToNuGetModule waits for
# this workflow to pass on the commit before it publishes.
#
# Inside the .NET matrix the publishes competed with the test modules for CPUs, and the test-app
# publish was the critical path on every OS (12-25 minutes). Here they need no full solution build:
# TUnit.Engine.Tests builds the test projects it launches, packing needs only the libraries, and the
# test-app publish compiles into its own artifacts tree.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      analyze_windows_dump_run:
        description: 'Also analyze the Windows engine hang dump from this AOT run ID (optional)'
        required: false
        type: string
      analyze_windows_dump_artifact:
        description: 'Exact dump artifact ID (optional; disambiguates artifacts from rerun attempts)'
        required: false
        type: string

permissions:
  contents: read

# Push runs are grouped by commit, not by ref: UploadToNuGetModule requires a passing run on the
# exact commit it publishes, so a newer push to main must not cancel the run for an older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.sha) || github.run_id }}
  cancel-in-progress: true

jobs:
  aot:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: AOT (${{ matrix.os }})
    strategy:
      matrix:
        # macOS runners are the scarcest, so pull requests leave them out: their macOS job is the
        # dotnet.yml pipeline, which also runs the Reflection-mode engine tests. Pushes to main
        # and manual runs keep macOS, so UploadToNuGetModule still waits for it before publishing.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest","windows-latest","macos-latest"]') }}
      fail-fast: false
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          # Versioning reads the fetched history only; nothing in this job pushes.
          persist-credentials: false

      - name: Setup Dev Drive (Windows)
        if: matrix.os == 'windows-latest'
        uses: samypr100/setup-dev-drive@v4
        with:
          drive-size: 10GB
          trusted-dev-drive: true
          env-mapping: |
            NUGET_PACKAGES,{{ DEV_DRIVE }}/.nuget/packages
            TEMP,{{ DEV_DRIVE }}/tmp
            TMP,{{ DEV_DRIVE }}/tmp

      - name: Setup .NET Framework
        if: matrix.os == 'windows-latest'
        uses: microsoft/setup-msbuild@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.1.0

      - name: Enable Long Paths on Windows
        if: matrix.os == 'windows-latest'
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
        shell: pwsh

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: '6.7.x'

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4

      # See the matching step in dotnet.yml's modularpipeline job (issue #5622).
      - name: Export version env vars
        shell: bash
        # Passed through env, not expanded into the script: InformationalVersion carries the branch
        # name, which a workflow_dispatch run takes from whatever branch was selected. The GV_ prefix
        # matters: Windows environment names are case-insensitive, so GITVERSION_SEMVER would merge
        # with the action's own GitVersion_SemVer and bash would see only that spelling.
        env:
          GV_SEMVER: ${{ steps.gitversion.outputs.semVer }}
          GV_ASSEMBLYSEMVER: ${{ steps.gitversion.outputs.assemblySemVer }}
          GV_ASSEMBLYSEMFILEVER: ${{ steps.gitversion.outputs.assemblySemFileVer }}
          GV_INFORMATIONALVERSION: ${{ steps.gitversion.outputs.informationalVersion }}
          GV_FULLSEMVER: ${{ steps.gitversion.outputs.fullSemVer }}
        run: |
          if [ -z "$GV_SEMVER" ]; then
            echo "::error::GitVersion produced no semVer; Version would be empty."
            exit 1
          fi
          {
            echo "Version=$GV_SEMVER"
            echo "AssemblyVersion=$GV_ASSEMBLYSEMVER"
            echo "FileVersion=$GV_ASSEMBLYSEMFILEVER"
            echo "InformationalVersion=$GV_INFORMATIONALVERSION"
            echo "PackageVersion=$GV_FULLSEMVER"
          } >> "$GITHUB_ENV"

      # Every library project (packing reads the Roslyn variants from their own bin folders), the
      # engine tests with the test projects they launch, and the pipeline itself.
      - name: Build
        shell: bash
        run: |
          grep -oE 'src/[^"]+\.(cs|fs|vb)proj' TUnit.CI.slnx | grep -v '/content/' \
            | jq -R . | jq -s '{solution: {path: "TUnit.CI.slnx", projects: .}}' > libraries.slnf
          if [ "$(jq '.solution.projects | length' libraries.slnf)" -eq 0 ]; then
            echo "::error::No library projects found in TUnit.CI.slnx; update the filter in this step."
            exit 1
          fi
          dotnet build libraries.slnf -c Release
          dotnet build tests/TUnit.Engine.Tests/TUnit.Engine.Tests.csproj -c Release
          dotnet build tools/TUnit.Pipeline/TUnit.Pipeline.csproj -c Release

      - name: Run Pipeline
        uses: ./.github/actions/execute-pipeline
        with:
          categories: Aot Packaging
          admin-token: ${{ github.token }}

      - name: Upload Diagnostic Logs
        uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: TestingPlatformDiagnosticLogs-aot-${{ matrix.os }}
          path: '**/log_*.diag'

      - name: Upload Hang Dumps
        uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: HangDump-aot-${{ matrix.os }}
          path: '**/hangdump*'

  # The Reflection-mode engine tests, plus the tests that don't run per mode. In the dotnet.yml
  # pipeline they waited for every other test module, then ran alone for 3-7 minutes at the end of
  # the job. They need only TUnit.Engine.Tests and the test projects it launches, and no versioning.
  engine-tests:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Engine tests (${{ matrix.os }})
    strategy:
      matrix:
        # Same platforms as the aot job: on pull requests the macOS engine tests run in dotnet.yml.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest","windows-latest","macos-latest"]') }}
      fail-fast: false
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Dev Drive (Windows)
        if: matrix.os == 'windows-latest'
        uses: samypr100/setup-dev-drive@v4
        with:
          drive-size: 10GB
          trusted-dev-drive: true
          env-mapping: |
            NUGET_PACKAGES,{{ DEV_DRIVE }}/.nuget/packages
            TEMP,{{ DEV_DRIVE }}/tmp
            TMP,{{ DEV_DRIVE }}/tmp

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.1.0

      - name: Enable Long Paths on Windows
        if: matrix.os == 'windows-latest'
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
        shell: pwsh

      - name: Build
        shell: bash
        run: |
          dotnet build tests/TUnit.Engine.Tests/TUnit.Engine.Tests.csproj -c Release
          dotnet build tools/TUnit.Pipeline/TUnit.Pipeline.csproj -c Release

      - name: Run Pipeline
        uses: ./.github/actions/execute-pipeline
        with:
          categories: EngineTests
          admin-token: ${{ github.token }}

      - name: Upload Diagnostic Logs
        uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: TestingPlatformDiagnosticLogs-engine-tests-${{ matrix.os }}
          path: '**/log_*.diag'

      - name: Upload Hang Dumps
        uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: HangDump-engine-tests-${{ matrix.os }}
          path: '**/hangdump*'

  analyze-windows-dump:
    if: github.event_name == 'workflow_dispatch' && inputs.analyze_windows_dump_run != ''
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Download captured Windows engine dump
        uses: actions/download-artifact@v5
        with:
          name: ${{ inputs.analyze_windows_dump_artifact == '' && 'HangDump-engine-tests-windows-latest' || '' }}
          artifact-ids: ${{ inputs.analyze_windows_dump_artifact }}
          run-id: ${{ inputs.analyze_windows_dump_run }}
          github-token: ${{ github.token }}
          path: captured-dump

      - name: Extract managed stacks and async waits
        shell: pwsh
        run: |
          dotnet tool install --global dotnet-dump --version 10.0.750501
          if ($LASTEXITCODE -ne 0) { throw 'dotnet-dump installation failed' }
          $dumps = @(Get-ChildItem captured-dump -Recurse -Filter 'hangdump.windows-reflection-pass.dmp')
          if ($dumps.Count -ne 1) { throw "Expected one Windows reflection pass dump, found $($dumps.Count)" }
          New-Item -ItemType Directory -Path analysis | Out-Null
          dotnet-dump analyze $dumps[0].FullName -c 'clrthreads' -c 'clrstack -all' -c 'dumpasync' -c 'exit' *> analysis/managed-stacks.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dump analysis failed; see managed-stacks.txt' }

      - name: Upload managed dump analysis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-engine-dump-analysis
          path: analysis/
          if-no-files-found: warn
