name: Worktree cleanup safety

on:
  push:
    branches: [main]
    paths: ['.gitignore', 'scripts/*Worktree*.ps1', 'scripts/Test-WorkflowArtifactCleanup.ps1', '.github/workflows/worktree-cleanup.yml']
  pull_request:
    paths: ['.gitignore', 'scripts/*Worktree*.ps1', 'scripts/Test-WorkflowArtifactCleanup.ps1', '.github/workflows/worktree-cleanup.yml']

permissions:
  contents: read

jobs:
  cleanup:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test generated output and source preservation
        shell: pwsh
        run: ./scripts/Test-WorkflowArtifactCleanup.ps1
      - name: Test existing cleanup safeguards
        shell: pwsh
        run: |
          if (Test-Path scripts/Test-WorktreeCleanup.ps1) { & ./scripts/Test-WorktreeCleanup.ps1; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
          if (Test-Path scripts/Test-RemoveMergedWorktrees.ps1) { & ./scripts/Test-RemoveMergedWorktrees.ps1; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
