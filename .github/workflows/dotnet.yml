name: .NET

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ["main"]
  workflow_dispatch:
    inputs:
      categories:
        description: Categories to run
        type: string
        required: false
      publish-packages:
        description: Publish packages?
        type: boolean
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: true

jobs:
  modularpipeline:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    environment: ${{ github.ref == 'refs/heads/main' && 'Production' || 'Pull Requests' }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    permissions:
      # UploadToNuGetModule reads the aot.yml runs for the commit before it publishes.
      actions: read
      contents: write
      id-token: write

    steps:
      - name: Free Disk Space (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: false
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Dev Drive (Windows)
        if: matrix.os == 'windows-latest'
        uses: samypr100/setup-dev-drive@v4
        with:
          drive-size: 10GB
          trusted-dev-drive: true
          env-mapping: |
            NUGET_PACKAGES,{{ DEV_DRIVE }}/.nuget/packages
            TEMP,{{ DEV_DRIVE }}/tmp
            TMP,{{ DEV_DRIVE }}/tmp

      - name: Check for .received.txt files
        shell: bash
        run: |
          if find . -name "*.received.txt" -not -path "./node_modules/*" | grep -q .; then
            echo "ERROR: .received.txt files found. These should not be committed."
            echo "Please replace them with .verified.txt files or remove them."
            find . -name "*.received.txt" -not -path "./node_modules/*"
            exit 1
          fi

      - name: Setup .NET Framework
        if: matrix.os == 'windows-latest'
        uses: microsoft/setup-msbuild@v3

      # No NuGet or Playwright cache: PR-scoped entries can't be shared between PRs, and at
      # ~2.4 GB each they pushed the repository past its cache quota, so every run missed and
      # then spent up to 3 minutes saving an entry that was evicted within the hour.
      - name: Setup .NET
        uses: actions/setup-dotnet@v6.1.0

      - name: Enable Long Paths on Windows
        if: matrix.os == 'windows-latest'
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
        shell: pwsh

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: '6.7.x'

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4

      # Export GitVersion outputs as env vars. MSBuild auto-binds env vars whose name
      # matches a property to a global property, so every subsequent dotnet build/publish/
      # pack/test in this job — including ones launched by TUnit.Pipeline — stamps the
      # correct AssemblyVersion/FileVersion even on AOT recompiles. Without this, a
      # publish that triggers a recompile drops AssemblyVersion to 1.0.0.0, and any
      # following `pack --no-build` ships a strong-name-mismatched package (issue #5622).
      - name: Export version env vars
        shell: bash
        run: |
          {
            echo "Version=${{ steps.gitversion.outputs.semVer }}"
            echo "AssemblyVersion=${{ steps.gitversion.outputs.assemblySemVer }}"
            echo "FileVersion=${{ steps.gitversion.outputs.assemblySemFileVer }}"
            echo "InformationalVersion=${{ steps.gitversion.outputs.informationalVersion }}"
            echo "PackageVersion=${{ steps.gitversion.outputs.fullSemVer }}"
          } >> "$GITHUB_ENV"

      # Windows and macOS pull request runs test only what can differ by OS (--os-specific-only
      # below): Ubuntu runs every suite, so the PlatformNeutral suites' projects need not build here.
      # Windows still builds the suites with .NET Framework snapshots, which only it can run. The
      # list names what to leave out, so a new project builds everywhere until it is added here;
      # anything an included project references still builds through its project reference.
      - name: Select projects
        id: projects
        shell: bash
        env:
          OS_SPECIFIC_ONLY: ${{ github.event_name == 'pull_request' && matrix.os != 'ubuntu-latest' }}
        run: |
          if [ "$OS_SPECIFIC_ONLY" != "true" ]; then
            echo "solution=TUnit.CI.slnx" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          excluded=(
            tests/TUnit.Analyzers.Internal.Tests/
            tests/TUnit.Analyzers.Tests/
            tests/TUnit.AspNetCore.Analyzers.Tests/
            tests/TUnit.Assertions.Analyzers.CodeFixers.Tests/
            tests/TUnit.Assertions.Analyzers.Tests/
            tests/TUnit.Assertions.Should.SourceGenerator.Tests/
            tests/TUnit.Assertions.Should.Tests/
            tests/TUnit.Assertions.Tests/
            tests/TUnit.Mocks.
            tests/TUnit.SourceGenerator.IncrementalTests/
            tests/TUnit.Templates.Tests/
            # Linux-only modules (RunAspireTestsModule, RunAspNetTestsModule), and projects no
            # module runs.
            tests/TUnit.Aspire.Tests
            examples/
            benchmarks/
          )
          if [ "${{ matrix.os }}" != "windows-latest" ]; then
            excluded+=(
              tests/TUnit.Core.SourceGenerator.Tests/
              tests/TUnit.Assertions.SourceGenerator.Tests/
              tests/TUnit.PublicAPI/
            )
          fi
          printf '%s\n' "${excluded[@]}" > excluded-projects.txt
          grep -oE 'Path="[^"]+\.(cs|fs|vb)proj"' TUnit.CI.slnx | sed -E 's/^Path="(.*)"$/\1/' \
            | grep -vFf excluded-projects.txt \
            | jq -R . | jq -s '{solution: {path: "TUnit.CI.slnx", projects: .}}' > ci.slnf
          echo "Building $(jq '.solution.projects | length' ci.slnf) of $(grep -cE 'Path="[^"]+proj"' TUnit.CI.slnx) projects:"
          jq -r '.solution.projects[]' ci.slnf
          echo "solution=ci.slnf" >> "$GITHUB_OUTPUT"

      - name: Restore
        shell: bash
        run: dotnet restore ${{ steps.projects.outputs.solution }}

      - name: Build
        shell: bash
        run: >-
          dotnet build ${{ steps.projects.outputs.solution }} -c Release --no-restore -graphBuild:True
          "-p:Version=${{ steps.gitversion.outputs.semVer }}"
          "-p:AssemblyVersion=${{ steps.gitversion.outputs.assemblySemVer }}"
          "-p:FileVersion=${{ steps.gitversion.outputs.assemblySemFileVer }}"
          "-p:InformationalVersion=${{ steps.gitversion.outputs.informationalVersion }}"
          "-p:PackageVersion=${{ steps.gitversion.outputs.fullSemVer }}"

      - name: Expose GitHub Actions Runtime
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN']);
            core.exportVariable('ACTIONS_RESULTS_URL', process.env['ACTIONS_RESULTS_URL']);

      - name: NuGet login
        if: ${{ github.ref == 'refs/heads/main' && github.event.inputs.publish-packages == 'true' && matrix.os == 'ubuntu-latest' }}
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      # Capture native runtime faults (including exit 139 before MTP reports tests).
      # Use an absolute path because the pipeline launches tests from several directories.
      - name: Enable macOS crash dumps
        if: runner.os == 'macOS' && vars.CRASH_DUMP_ENCRYPTION_CERT != ''
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/tunit-crash-dumps"
          echo "DOTNET_DbgEnableMiniDump=1" >> "$GITHUB_ENV"
          echo "DOTNET_DbgMiniDumpType=2" >> "$GITHUB_ENV"
          echo "DOTNET_DbgMiniDumpName=$RUNNER_TEMP/tunit-crash-dumps/crash.%e.%p.dmp" >> "$GITHUB_ENV"

      - name: Run Pipeline
        uses: ./.github/actions/execute-pipeline
        with:
          admin-token: ${{ secrets.ADMIN_TOKEN }}
          environment: ${{ github.ref == 'refs/heads/main' && 'Production' || 'Development' }}
          nuget-apikey: ${{ steps.login.outputs.NUGET_API_KEY }}
          publish-packages: ${{ (github.event.inputs.publish-packages || false) && matrix.os == 'ubuntu-latest' }}
          # The native AOT publishes (the test app with its engine tests, and the NugetTester) and
          # the Reflection-mode engine tests run in aot.yml.
          # Only Ubuntu packs and tests the packages: it is the runner that publishes them. Windows
          # tests them in the nuget-package-tests-windows job instead, where with every .NET
          # Framework TFM they no longer compete with the engine tests for this runner's CPUs.
          # macOS skips them: the packages are platform-neutral, and packing and testing them took
          # CPU from the test modules on the smallest runner.
          # On pull requests macOS runs the Reflection-mode engine tests here: aot.yml leaves macOS
          # out of pull requests, so this is the only general macOS job a PR push queues.
          ignore-categories: >-
            ${{ matrix.os == 'ubuntu-latest' && 'Aot EngineTests'
            || (matrix.os == 'macos-latest' && github.event_name == 'pull_request') && 'Aot Packaging NuGetPackageTests'
            || 'Aot EngineTests Packaging NuGetPackageTests' }}
          # On pull requests Windows and macOS skip what Ubuntu already proves: the PlatformNeutral
          # suites, apart from the .NET Framework TFMs only Windows can run (see PipelineScope).
          # Manual runs, which publish, keep every suite on every OS.
          os-specific-only: ${{ github.event_name == 'pull_request' && matrix.os != 'ubuntu-latest' }}

      # Never upload raw process memory: the pipeline and its children inherit credentials.
      - name: Encrypt macOS crash dumps
        if: always() && runner.os == 'macOS' && vars.CRASH_DUMP_ENCRYPTION_CERT != ''
        shell: bash
        env:
          CRASH_DUMP_ENCRYPTION_CERT: ${{ vars.CRASH_DUMP_ENCRYPTION_CERT }}
        run: |
          set -euo pipefail
          cert="$RUNNER_TEMP/tunit-crash-dump-recipient.pem"
          printf '%s\n' "$CRASH_DUMP_ENCRYPTION_CERT" > "$cert"
          trap 'rm -f "$cert" "$RUNNER_TEMP"/tunit-crash-dumps/*.dmp' EXIT
          mkdir -p "$RUNNER_TEMP/tunit-crash-dumps-encrypted"
          shopt -s nullglob
          for dump in "$RUNNER_TEMP"/tunit-crash-dumps/*.dmp; do
            encrypted="$RUNNER_TEMP/tunit-crash-dumps-encrypted/$(basename "$dump").cms"
            openssl cms -encrypt -binary -aes-256-cbc -in "$dump" -outform DER -out "$encrypted.tmp" "$cert"
            mv "$encrypted.tmp" "$encrypted"
          done

      - name: Upload encrypted macOS crash dumps
        uses: actions/upload-artifact@v7.0.2
        if: always() && runner.os == 'macOS'
        with:
          name: EncryptedNativeCrashDumps-${{matrix.os}}
          path: ${{ runner.temp }}/tunit-crash-dumps-encrypted/*.cms
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Diagnostic Logs
        uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: TestingPlatformDiagnosticLogs${{matrix.os}}
          path: '**/log_*.diag'

      # Snapshot mismatches leave *.received.txt next to the *.verified.txt they failed against.
      # The .Net4_7 snapshots can only be produced on Windows, so contributors on Linux/macOS
      # take them from this artifact.
      - name: Upload Received Snapshots
        uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: ReceivedSnapshots-${{matrix.os}}
          path: |
            **/*.received.*
            **/*.received/**
          if-no-files-found: ignore

      - name: Upload Hang Dumps
        uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: HangDump${{matrix.os}}
          path: '**/hangdump*'

      - name: NuGet Packages Artifacts
        uses: actions/upload-artifact@v7.0.2
        if: always() && matrix.os == 'ubuntu-latest'
        with:
          name: 'NuGetPackages-${{matrix.os}}'
          path: '**/*.*nupkg'

  # Native AOT publishes of the mock test projects. Run inside the Ubuntu pipeline they held up
  # packaging behind them. One runner publishes every framework in turn (~10 minutes, well inside
  # the matrix jobs): a runner per framework spent a third of each job on setup and took two more
  # of the runners that every push competes for.
  mock-aot:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: mock AOT
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DISABLE_GITHUB_REPORTER: 'true'

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.1.0

      # TUnit.Mocks.Aot.Tests sets TreatWarningsAsErrors, so any trim/AOT warning ILC reports
      # for everyday mock usage fails its publish (#7027). Every framework still runs after an
      # earlier one fails, so a single run reports them all.
      - name: Publish and run
        shell: bash
        run: |
          failed=()
          for framework in net8.0 net9.0 net10.0; do
            for project in TUnit.Mocks.Tests TUnit.Mocks.Aot.Tests; do
              echo "::group::$project ($framework)"
              if dotnet publish "tests/$project/$project.csproj" -c Release --use-current-runtime \
                  -p:Aot=true --framework "$framework" -o "aot/$framework/$project" \
                && "aot/$framework/$project/$project"; then
                echo "::endgroup::"
              else
                echo "::endgroup::"
                echo "::error::$project failed on $framework"
                failed+=("$project ($framework)")
              fi
            done
          done
          if (( ${#failed[@]} )); then
            printf 'Failed: %s\n' "${failed[@]}"
            exit 1
          fi

  # Tests the packed packages on Windows, including every .NET Framework TFM, on a runner of its
  # own. Linux and macOS still test them inside the matrix pipeline.
  nuget-package-tests-windows:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          # Versioning reads the fetched history only; nothing in this job pushes.
          persist-credentials: false

      - name: Setup Dev Drive
        uses: samypr100/setup-dev-drive@v4
        with:
          drive-size: 10GB
          trusted-dev-drive: true
          env-mapping: |
            NUGET_PACKAGES,{{ DEV_DRIVE }}/.nuget/packages
            TEMP,{{ DEV_DRIVE }}/tmp
            TMP,{{ DEV_DRIVE }}/tmp

      - name: Setup .NET Framework
        uses: microsoft/setup-msbuild@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.1.0

      - name: Enable Long Paths
        run: |
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force
        shell: pwsh

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: '6.7.x'

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4

      # See the matching step in the modularpipeline job (issue #5622).
      - name: Export version env vars
        shell: bash
        run: |
          {
            echo "Version=${{ steps.gitversion.outputs.semVer }}"
            echo "AssemblyVersion=${{ steps.gitversion.outputs.assemblySemVer }}"
            echo "FileVersion=${{ steps.gitversion.outputs.assemblySemFileVer }}"
            echo "InformationalVersion=${{ steps.gitversion.outputs.informationalVersion }}"
            echo "PackageVersion=${{ steps.gitversion.outputs.fullSemVer }}"
          } >> "$GITHUB_ENV"

      # Only what packing needs: every library project (packing reads the Roslyn variants from
      # their own bin folders) and the pipeline itself.
      - name: Build
        shell: bash
        run: |
          grep -oE 'src/[^"]+\.(cs|fs|vb)proj' TUnit.CI.slnx | grep -v '/content/' \
            | jq -R . | jq -s '{solution: {path: "TUnit.CI.slnx", projects: .}}' > libraries.slnf
          if [ "$(jq '.solution.projects | length' libraries.slnf)" -eq 0 ]; then
            echo "::error::No library projects found in TUnit.CI.slnx; update the filter in this step."
            exit 1
          fi
          dotnet build libraries.slnf -c Release
          dotnet build tools/TUnit.Pipeline/TUnit.Pipeline.csproj -c Release

      - name: Run Pipeline
        uses: ./.github/actions/execute-pipeline
        with:
          categories: Packaging NuGetPackageTests
          admin-token: ${{ github.token }}

      - name: Upload Diagnostic Logs
        uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: TestingPlatformDiagnosticLogs-nuget-package-tests-windows
          path: '**/log_*.diag'

      - name: Upload Hang Dumps
        uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: HangDump-nuget-package-tests-windows
          path: '**/hangdump*'

  # Compiles the C# fences in the documentation against freshly packed packages, alongside the
  # test matrix rather than after the Ubuntu pipeline.
  doc-snippets:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DocsVersion: 1.0.0-docs

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@v6.1.0

      # Packing reads the Roslyn analyzer/generator variants from their own bin folders, so build
      # every library project, not just the packed ones.
      - name: Build libraries
        shell: bash
        run: |
          grep -oE 'src/[^"]+\.(cs|fs|vb)proj' TUnit.CI.slnx | grep -v '/content/' \
            | jq -R . | jq -s '{solution: {path: "TUnit.CI.slnx", projects: .}}' > libraries.slnf
          dotnet build libraries.slnf -c Release "-p:Version=$DocsVersion"

      - name: Pack
        shell: bash
        run: dotnet pack libraries.slnf -c Release --no-build "-p:Version=$DocsVersion" -o artifacts/doc-packages

      - name: Compile documentation snippets
        shell: pwsh
        run: ./scripts/Verify-DocSnippets.ps1 -PackagesPath artifacts/doc-packages -Version $env:DocsVersion

      - name: Verify packaged F# async trimming
        shell: pwsh
        run: ./scripts/Verify-FSharpTrimming.ps1 -PackagesPath artifacts/doc-packages -Version $env:DocsVersion

      - name: Upload trimming smoke logs
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: fsharp-trimming-logs
          path: artifacts/fsharp-trimming/**/*.log
