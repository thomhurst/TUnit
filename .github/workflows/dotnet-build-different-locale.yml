name: Locale Test

on:
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  modularpipeline:
    strategy:
      matrix:
        # sv-SE: negative numbers use U+2212 MINUS SIGN (also fi-FI, nb-NO, et-EE, lt-LT).
        # de-DE / fr-FR / pl-PL: decimal comma. tr-TR: dotless i in casing. ar-SA: Arabic number formatting.
        locale: [fr-FR, pl-PL, de-DE, sv-SE, tr-TR, ar-SA]
      fail-fast: false
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # Build only: the SDK pinned by global.json builds every target framework.
      - name: Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: Generate and set locale for subsequent steps
        run: |
          # Convert hyphen (fr-FR) to underscore (fr_FR) which is the correct locale name on Ubuntu
          LOCALE=${{ matrix.locale }}
          LOCALE=${LOCALE/-/_}

          sudo apt-get update
          sudo apt-get install -y locales
          sudo locale-gen "${LOCALE}.UTF-8"
          sudo update-locale LANG="${LOCALE}.UTF-8"

          # Export for subsequent GitHub Actions steps
          echo "LANG=${LOCALE}.UTF-8" >> $GITHUB_ENV
          echo "LC_ALL=${LOCALE}.UTF-8" >> $GITHUB_ENV

      # The whole CI solution, not just one project: every source generator runs during this build,
      # inside a compiler that uses the locale above, and must still emit valid C#.
      # A version is passed as the main pipeline does: under GitHub Actions Directory.Build.props
      # leaves Version unset, and TUnit.Assertions.Should's "$(Version)-beta" would then be invalid.
      - name: Build
        run: dotnet build TUnit.CI.slnx -c Release -p:Version=1.0.0
